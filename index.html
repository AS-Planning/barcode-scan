<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>바코드 스캔</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;overflow:hidden;}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  #frame{position:fixed;left:4%;right:4%;top:50%;height:22vh;transform:translateY(-50%);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);transition:border-color .15s;}
  #frame.ok{border-color:#2ecc71;}
  #frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,60,60,.85);}
  #top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;justify-content:space-between;gap:10px;}
  #top button{font-size:16px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:10px 16px;}
  #top button.on{background:#1C69D4;border-color:#1C69D4;}
  #hint{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 22px);text-align:center;font-size:16px;line-height:1.5;background:linear-gradient(transparent,rgba(0,0,0,.8));}
  #hint small{font-size:13px;opacity:.85;}
  #err{display:none;position:fixed;inset:0;background:#111;padding:24px;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
  #err .t{font-size:19px;font-weight:700;}
  #err .p{font-size:14px;line-height:1.6;opacity:.85;}
  #err button{width:100%;max-width:340px;font-size:17px;font-weight:700;border-radius:12px;padding:15px;border:0;}
  #retry{background:#1C69D4;color:#fff;}
  #back,#photo{background:#333;color:#fff;}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="frame"></div>
<div id="top"><button id="x">✕ 닫기</button><button id="zoom" style="display:none">🔍 2×</button></div>
<div id="hint">카메라 여는 중…</div>
<div id="err"><div class="t" id="err-t">카메라를 열 수 없습니다</div><div class="p" id="err-p"></div><button id="retry">카메라 다시 열기</button><button id="photo">사진 촬영으로 하기</button><button id="back">검수 화면으로 돌아가기</button></div>
<script src="zxing.min.js"></script>
<script>
const TARGET = 'http://part.nationalmotors.co.kr/insp/m/';
const TAB = new URLSearchParams(location.search).get('t') === 'misc' ? 'misc' : 'scan';
const $ = id => document.getElementById(id);
const PN_STRICT = /^\d{5}[0-9A-Z]{6}$/;
let scanning=false, done=false, starting=false, _stream=null, _bd=null, _zx=null, _zxHints=null, _roiCv=null, _roiCtx=null, _last={v:'',t:0};
const _PREP=[null,[0.9,3],null,[0.9,5]];
let _tickN=0, _prepBuf=null, _prepCv=null, _prepCtx=null, _zoomOn=false, _zoomCaps=null;
function strictPn(text){ const t=String(text||'').trim().toUpperCase().replace(/\s+/g,''); if(/^\d{10}$/.test(t)) return '0'+t; return PN_STRICT.test(t) ? t : ''; }
function fmtPn(p){ return p.length===11 ? p.slice(0,2)+' '+p.slice(2,4)+' '+p.slice(4,5)+' '+p.slice(5,8)+' '+p.slice(8) : p; }
function go(pn, photo){
  done=true; stop();
  const q=[]; if(pn) q.push('pn='+encodeURIComponent(pn)); if(TAB==='misc') q.push('tab=misc'); if(photo) q.push('photo=1');
  location.replace(TARGET + (q.length ? '?'+q.join('&') : ''));
}
async function initDetector(){
  if(_bd || _zx) return;
  try{ if('BarcodeDetector' in window){ const fm = await BarcodeDetector.getSupportedFormats(); const want = ['code_39','code_128'].filter(f=>fm.includes(f)); if(want.length){ _bd = new BarcodeDetector({formats:want}); return; } } }catch(e){}
  if(!window.ZXing) return;
  _zxHints = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_128]],[ZXing.DecodeHintType.TRY_HARDER, true]]);
  if(ZXing.MultiFormatOneDReader){ _zx = new ZXing.MultiFormatOneDReader(_zxHints); } else { _zx = new ZXing.MultiFormatReader(); _zx.setHints(_zxHints); }
}
function _roi(){ const v=$('v'); const W=v.videoWidth, H=v.videoHeight; if(!W||!H) return null; const w=Math.round(W*0.92), h=Math.round(H*(H>1500?0.16:0.30)); return {x:(W-w)>>1, y:(H-h)>>1, w, h}; }
function _grabRoi(){ const r=_roi(); if(!r) return null; if(!_roiCv){ _roiCv=document.createElement('canvas'); _roiCtx=_roiCv.getContext('2d',{willReadFrequently:true}); } if(_roiCv.width!==r.w||_roiCv.height!==r.h){ _roiCv.width=r.w; _roiCv.height=r.h; } _roiCtx.drawImage($('v'), r.x, r.y, r.w, r.h, 0, 0, r.w, r.h); return _roiCv; }
function _lum(ctx, w, h){ const d=ctx.getImageData(0,0,w,h).data, n=w*h; if(!_prepBuf || _prepBuf.n!==n){ _prepBuf={n, L:new Uint8ClampedArray(n), P:new Uint32Array(w+1), B:new Uint8ClampedArray(n)}; } const L=_prepBuf.L; for(let i=0,j=0;i<n;i++,j+=4) L[i]=(d[j]*306+d[j+1]*601+d[j+2]*117)>>10; return L; }
function _prep(L, w, h, bias, k){ const P=_prepBuf.P, B=_prepBuf.B, blk=Math.max(9, Math.round(w*0.03)|1), hb=blk>>1;
  for(let y=0;y<h;y++){ const b=y*w; P[0]=0; for(let x=0;x<w;x++) P[x+1]=P[x]+L[b+x];
    for(let x=0;x<w;x++){ const x0=x-hb<0?0:x-hb, x1=x+hb+1>w?w:x+hb+1; B[b+x] = L[b+x]*(x1-x0) > (P[x1]-P[x0])*bias ? 255 : 0; }
    if(k>1){ let x=0; while(x<w){ if(B[b+x]===255){ let e=x; while(e<w&&B[b+e]===255) e++; if(e-x<k && x>0 && e<w){ for(let i=x;i<e;i++) B[b+i]=0; } x=e; } else x++; } } }
  return B; }
function _lumSrc(arr, w, h){ const src=new ZXing.RGBLuminanceSource(arr, w, h); src.isRotateSupported=()=>false; return src; }
async function decodeCanvas(cv, variant){
  const w=cv.width, h=cv.height;
  if(_bd){ let src=cv;
    if(variant){ const B=_prep(_lum(_roiCtx,w,h), w, h, variant[0], variant[1]); if(!_prepCv){ _prepCv=document.createElement('canvas'); _prepCtx=_prepCv.getContext('2d'); } if(_prepCv.width!==w||_prepCv.height!==h){ _prepCv.width=w; _prepCv.height=h; }
      const img=_prepCtx.createImageData(w,h), q=img.data; for(let i=0,j=0;i<B.length;i++,j+=4){ q[j]=q[j+1]=q[j+2]=B[i]; q[j+3]=255; } _prepCtx.putImageData(img,0,0); src=_prepCv; }
    try{ const res = await _bd.detect(src); return res.length ? (res[0].rawValue||'') : ''; }catch(e){ return ''; } }
  if(_zx){ try{ const L=_lum(_roiCtx,w,h); const arr = variant ? _prep(L, w, h, variant[0], variant[1]) : L; const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(_lumSrc(arr, w, h))); return _zx.decode(bmp, _zxHints).getText() || ''; }catch(e){ return ''; } }
  return '';
}
async function tick(){
  if(!scanning) return;
  const v=$('v');
  if(v.readyState >= 2){ const cv=_grabRoi();
    if(cv){ const raw = await decodeCanvas(cv, _PREP[(_tickN++) % _PREP.length]);
      if(raw && scanning){ const pn = strictPn(raw), now = performance.now();
        if(!pn){ $('hint').textContent = '인식됨: '+raw+' (부품번호 형식 아님)'; _last={v:'',t:0}; }
        else if(_last.v===pn && now-_last.t < 1500){ scanning=false; $('frame').classList.add('ok'); $('hint').textContent = '✔ '+fmtPn(pn); if(navigator.vibrate) navigator.vibrate(60); setTimeout(()=>go(pn), 120); return; }
        else { _last={v:pn,t:now}; $('hint').textContent = '확인 중… '+fmtPn(pn); } } } }
  setTimeout(tick, 0);
}
function showErr(title, msg){ $('err-t').textContent=title; $('err-p').textContent=msg; $('err').style.display='flex'; }
async function start(){
  if(done || scanning || starting) return;
  starting=true; $('err').style.display='none'; $('frame').classList.remove('ok'); $('hint').textContent='카메라 여는 중…'; _last={v:'',t:0};
  try{
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showErr('이 주소에서는 카메라를 쓸 수 없습니다', 'https 주소로 열어 주세요.'); return; }
    await initDetector();
    if(!_bd && !_zx){ showErr('스캐너를 불러오지 못했습니다', '화면을 새로 고쳐 주세요.'); return; }
    _stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160}}});
    _zoomCaps=null; _zoomOn=false; $('zoom').classList.remove('on'); $('zoom').textContent='🔍 2×';
    try{ const tr=_stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if(caps.focusMode && caps.focusMode.includes('continuous')) await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); if(caps.zoom && typeof caps.zoom.max==='number' && caps.zoom.max>=2){ _zoomCaps=caps.zoom; } }catch(e){}
    $('zoom').style.display = _zoomCaps ? '' : 'none';
    const v=$('v'); v.srcObject=_stream; await v.play();
    scanning=true; _tickN=0;
    $('hint').innerHTML='바코드를 사각형 안에 가로로 맞춰주세요<br><small>읽히면 검수 화면으로 바로 넘어갑니다'+(_zoomCaps?' · 작은 라벨은 [2×]':'')+'</small>';
    try{ if(_zoomCaps && localStorage.getItem('scan_zoom')==='1') await toggleZoom(); }catch(e){}
    tick();
  }catch(e){
    stop();
    const n = e && e.name || '';
    showErr('카메라를 열 수 없습니다', n==='NotAllowedError' ? '카메라 권한이 꺼져 있습니다. 주소창의 사이트 설정에서 카메라를 「허용」으로 바꾼 뒤 다시 열어 주세요.' : (n || (e && e.message) || '알 수 없는 오류'));
  }finally{ starting=false; }
}
async function toggleZoom(){
  if(!_stream || !_zoomCaps) return;
  const tr=_stream.getVideoTracks()[0]; const on=!_zoomOn; const z = on ? Math.min(2, _zoomCaps.max) : Math.max(1, _zoomCaps.min||1);
  try{ await tr.applyConstraints({advanced:[{zoom:z}]}); _zoomOn=on; $('zoom').classList.toggle('on', on); $('zoom').textContent = on ? '🔍 1×' : '🔍 2×'; try{ localStorage.setItem('scan_zoom', on?'1':'0'); }catch(e){} }
  catch(e){ _zoomCaps=null; $('zoom').style.display='none'; }
}
function stop(){ scanning=false; _zoomOn=false; try{ if(_stream) _stream.getTracks().forEach(t=>t.stop()); }catch(e){} _stream=null; const v=$('v'); if(v) v.srcObject=null; }
$('x').onclick = () => go('');
$('back').onclick = () => go('');
$('photo').onclick = () => go('', true);
$('retry').onclick = () => start();
$('zoom').onclick = () => toggleZoom();
document.addEventListener('visibilitychange', () => { if(document.hidden){ if(scanning) stop(); } else if(!done){ start(); } });
window.addEventListener('pageshow', e => { if(e.persisted){ done=false; start(); } });
start();
</script>
</body>
</html>
