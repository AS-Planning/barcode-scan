<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>바코드 스캔</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;overflow:hidden;}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  #frame{position:fixed;left:4%;right:4%;top:50%;height:30vh;transform:translateY(-50%);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);transition:border-color .15s;}
  #frame.ok{border-color:#2ecc71;}
  #frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,60,60,.85);}
  #top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;justify-content:space-between;gap:10px;}
  #top button{font-size:16px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:10px 16px;}
  #top button.on{background:#1C69D4;border-color:#1C69D4;}
  #hint{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 22px);text-align:center;font-size:16px;line-height:1.5;background:linear-gradient(transparent,rgba(0,0,0,.8));}
  #hint small{font-size:13px;opacity:.85;}
  #err{display:none;position:fixed;inset:0;background:#111;padding:24px;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
  #err .t{font-size:19px;font-weight:700;}
  #err .p{font-size:14px;line-height:1.6;opacity:.85;}
  #err button{width:100%;max-width:340px;font-size:17px;font-weight:700;border-radius:12px;padding:15px;border:0;}
  #retry{background:#1C69D4;color:#fff;}
  #back,#photo{background:#333;color:#fff;}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="frame"></div>
<div id="top"><button id="x">✕ 닫기</button><span><button id="torch" style="display:none">🔦 조명</button> <button id="zoom" style="display:none">🔍 2×</button></span></div>
<div id="hint">카메라 여는 중…</div>
<div id="err"><div class="t" id="err-t">카메라를 열 수 없습니다</div><div class="p" id="err-p"></div><button id="retry">카메라 다시 열기</button><button id="photo">사진 촬영으로 하기</button><button id="back">검수 화면으로 돌아가기</button></div>
<script src="zxing_reader.js"></script>
<script src="zxing.min.js"></script>
<script>
const TARGET = 'http://part.nationalmotors.co.kr/insp/m/';
const TAB = new URLSearchParams(location.search).get('t') === 'misc' ? 'misc' : 'scan';
const $ = id => document.getElementById(id);
const PN_STRICT = /^\d{5}[0-9A-Z]{6}$/;
let scanning=false, done=false, starting=false, _stream=null, _bd=null, _zx=null, _zxHints=null, _roiCv=null, _roiCtx=null, _last={v:'',t:0};
const _PREP=[null,[0.9,3],null,[0.9,5]];
let _tickN=0, _prepBuf=null, _prepCv=null, _prepCtx=null, _zoomOn=false, _zoomCaps=null, _torchCap=false, _torchOn=false;
function strictPn(text){ const t=String(text||'').trim().toUpperCase().replace(/\s+/g,''); if(/^\d{10}$/.test(t)) return '0'+t; return PN_STRICT.test(t) ? t : ''; }
function fmtPn(p){ return p.length===11 ? p.slice(0,2)+' '+p.slice(2,4)+' '+p.slice(4,5)+' '+p.slice(5,8)+' '+p.slice(8) : p; }
function go(pn, photo){
  done=true; stop();
  const q=[]; if(pn) q.push('pn='+encodeURIComponent(pn)); if(TAB==='misc') q.push('tab=misc'); if(photo) q.push('photo=1');
  location.replace(TARGET + (q.length ? '?'+q.join('&') : ''));
}
async function initDetector(){
  if(_bd || _zx) return;
  try{ if('BarcodeDetector' in window){ const fm = await BarcodeDetector.getSupportedFormats(); const want = ['code_39','code_128'].filter(f=>fm.includes(f)); if(want.length){ _bd = new BarcodeDetector({formats:want}); return; } } }catch(e){}
  if(!window.ZXing) return;
  _zxHints = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_128]],[ZXing.DecodeHintType.TRY_HARDER, true]]);
  if(ZXing.MultiFormatOneDReader){ _zx = new ZXing.MultiFormatOneDReader(_zxHints); } else { _zx = new ZXing.MultiFormatReader(); _zx.setHints(_zxHints); }
}
function _roi(){ const v=$('v'); const W=v.videoWidth, H=v.videoHeight; if(!W||!H) return null; const w=Math.round(W*0.92), h=Math.round(H*(H>1500?0.16:0.30)); return {x:(W-w)>>1, y:(H-h)>>1, w, h}; }
function _grabRoi(kind){
  const v=$('v'), W=v.videoWidth, H=v.videoHeight; if(!W||!H) return null;
  if(!_roiCv){ _roiCv=document.createElement('canvas'); _roiCtx=_roiCv.getContext('2d',{willReadFrequently:true}); }
  const set=(w,h)=>{ if(_roiCv.width!==w||_roiCv.height!==h){ _roiCv.width=w; _roiCv.height=h; } _roiCtx.setTransform(1,0,0,1,0,0); };
  if(kind==='v'){ const sw=Math.round(W*0.34), sh=Math.round(H*0.92), sx=(W-sw)>>1, sy=(H-sh)>>1, k=Math.min(1, 2000/sh), dw=Math.max(1,Math.round(sw*k)), dh=Math.max(1,Math.round(sh*k));
    set(dh,dw); _roiCtx.translate(dh,0); _roiCtx.rotate(Math.PI/2); _roiCtx.drawImage(v, sx,sy,sw,sh, 0,0,dw,dh); _roiCtx.setTransform(1,0,0,1,0,0); return _roiCv; }
  if(kind==='big'){ const sw=Math.round(W*0.96), sh=Math.round(H*0.60), sx=(W-sw)>>1, sy=(H-sh)>>1, k=Math.min(1, 1500/sw), dw=Math.max(1,Math.round(sw*k)), dh=Math.max(1,Math.round(sh*k));
    set(dw,dh); _roiCtx.drawImage(v, sx,sy,sw,sh, 0,0,dw,dh); return _roiCv; }
  const r=_roi(); if(!r) return null; set(r.w,r.h); _roiCtx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h); return _roiCv; }
/* 읽힌 값 중 부품번호 형식인 것 → {raw, pn, c128}. 여러 개면 화면 중앙에 가까운 것 */
function _pick(list){ let best=null; for(const x of list){ const pn=strictPn(x.raw); if(!pn) continue; if(!best || x.d < best.d) best={raw:x.raw, pn, c128:x.c128, d:x.d}; } return best || (list.length ? {raw:list[0].raw, pn:'', c128:false} : null); }
async function detectFull(){   /* BarcodeDetector: 화면 전체에서 방향 무관하게 찾기 */
  const v=$('v'); try{ const res = await _bd.detect(v); const cx=v.videoWidth/2, cy=v.videoHeight/2;
    return _pick(res.filter(r=>r.rawValue).map(r=>{ const b=r.boundingBox||{x:cx,y:cy,width:0,height:0}; return {raw:r.rawValue, c128:r.format==='code_128', d:Math.abs(b.x+b.width/2-cx)+Math.abs(b.y+b.height/2-cy)}; })); }catch(e){ return null; } }
function _lum(ctx, w, h){ const d=ctx.getImageData(0,0,w,h).data, n=w*h; if(!_prepBuf || _prepBuf.n!==n){ _prepBuf={n, L:new Uint8ClampedArray(n), P:new Uint32Array(w+1), B:new Uint8ClampedArray(n)}; } const L=_prepBuf.L; for(let i=0,j=0;i<n;i++,j+=4) L[i]=(d[j]*306+d[j+1]*601+d[j+2]*117)>>10; return L; }
function _prep(L, w, h, bias, k){ const P=_prepBuf.P, B=_prepBuf.B, blk=Math.max(9, Math.round(w*0.03)|1), hb=blk>>1;
  for(let y=0;y<h;y++){ const b=y*w; P[0]=0; for(let x=0;x<w;x++) P[x+1]=P[x]+L[b+x];
    for(let x=0;x<w;x++){ const x0=x-hb<0?0:x-hb, x1=x+hb+1>w?w:x+hb+1; B[b+x] = L[b+x]*(x1-x0) > (P[x1]-P[x0])*bias ? 255 : 0; }
    if(k>1){ let x=0; while(x<w){ if(B[b+x]===255){ let e=x; while(e<w&&B[b+e]===255) e++; if(e-x<k && x>0 && e<w){ for(let i=x;i<e;i++) B[b+i]=0; } x=e; } else x++; } } }
  return B; }
function _lumSrc(arr, w, h){ const src=new ZXing.RGBLuminanceSource(arr, w, h); src.isRotateSupported=()=>false; return src; }
async function decodeCanvas(cv, variant){
  const w=cv.width, h=cv.height;
  if(_bd){ let src=cv;
    if(variant){ const B=_prep(_lum(_roiCtx,w,h), w, h, variant[0], variant[1]); if(!_prepCv){ _prepCv=document.createElement('canvas'); _prepCtx=_prepCv.getContext('2d'); } if(_prepCv.width!==w||_prepCv.height!==h){ _prepCv.width=w; _prepCv.height=h; }
      const img=_prepCtx.createImageData(w,h), q=img.data; for(let i=0,j=0;i<B.length;i++,j+=4){ q[j]=q[j+1]=q[j+2]=B[i]; q[j+3]=255; } _prepCtx.putImageData(img,0,0); src=_prepCv; }
    try{ const res = await _bd.detect(src); return _pick(res.filter(r=>r.rawValue).map((r,i)=>({raw:r.rawValue, c128:r.format==='code_128', d:i}))); }catch(e){ return null; } }
  if(_zx){ try{ const L=_lum(_roiCtx,w,h); const arr = variant ? _prep(L, w, h, variant[0], variant[1]) : L; const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(_lumSrc(arr, w, h))); const r=_zx.decode(bmp, _zxHints); const t=r.getText()||''; return t ? {raw:t, pn:strictPn(t), c128:r.getBarcodeFormat()===ZXing.BarcodeFormat.CODE_128} : null; }catch(e){ return null; } }
  return null;
}
/* ── 주 엔진: zxing-cpp(WASM) — 방향 무관 · Code39/128. 실패하면 아래 기존 엔진(BarcodeDetector/ZXing JS)으로 ── */
let _legN=0, _wz=false, _wCv=null, _wCtx=null, _wL=null, _wT=null;
async function initWasm(){ if(_wz || !window.ZXingWASM) return; try{ await ZXingWASM.prepareZXingModule({overrides:{locateFile:(f,pre)=> f.endsWith('.wasm') ? 'zxing_reader.wasm' : pre+f}, fireImmediately:true}); _wz=true; }catch(e){ _wz=false; } }
function _vis(){ const v=$('v'), W=v.videoWidth, H=v.videoHeight; if(!W||!H) return null; const k=Math.max(innerWidth/W, innerHeight/H), w=Math.min(W, innerWidth/k), h=Math.min(H, innerHeight/k); return {x:(W-w)/2, y:(H-h)/2, w, h}; }
function _grabW(hf, wf, T, kmax){   /* 화면에 보이는 영역 가운데의 (폭 wf × 높이 hf) → 긴 변 T 에 맞춰(최대 kmax 배 확대) ImageData */
  const a=_vis(); if(!a) return null; const fw=(wf>=1 ? $('v').videoWidth : a.w*wf), sw=fw, sh=a.h*hf, sx=($('v').videoWidth-fw)/2, sy=a.y+(a.h-sh)/2, k=Math.min(kmax, T/Math.max(sw, sh)), dw=Math.max(8,Math.round(sw*k)), dh=Math.max(8,Math.round(sh*k));
  if(!_wCv){ _wCv=document.createElement('canvas'); _wCtx=_wCv.getContext('2d',{willReadFrequently:true}); }
  if(_wCv.width!==dw||_wCv.height!==dh){ _wCv.width=dw; _wCv.height=dh; }
  _wCtx.imageSmoothingQuality='high'; _wCtx.drawImage($('v'), sx, sy, sw, sh, 0, 0, dw, dh); return _wCtx.getImageData(0,0,dw,dh); }
function _dilate(img, d){   /* 가늘게 인쇄된 막대 보정 — 어두운 부분을 d 픽셀 굵게(방향 무관) */
  const w=img.width, h=img.height, q=img.data, n=w*h; if(!_wL || _wL.length!==n){ _wL=new Uint8Array(n); _wT=new Uint8Array(n); }
  const L=_wL, T=_wT; for(let i=0,j=0;i<n;i++,j+=4) L[i]=(q[j]*306+q[j+1]*601+q[j+2]*117)>>10;
  for(let y=0;y<h;y++){ const b=y*w; for(let x=0;x<w;x++){ let m=L[b+x]; for(let s=1;s<=d&&x-s>=0;s++){ const t=L[b+x-s]; if(t<m) m=t; } T[b+x]=m; } }
  for(let y=0;y<h;y++){ const b=y*w; for(let x=0;x<w;x++){ let m=T[b+x]; for(let s=1;s<=d&&y-s>=0;s++){ const t=T[b-s*w+x]; if(t<m) m=t; } const j=(b+x)<<2; q[j]=q[j+1]=q[j+2]=m; } }
  return img; }
/* [높이 비율, 폭 비율, 긴 변 목표 px, 최대 확대, 이진화, 굵게 px] — A 넓게 / Z 가운데 확대 / F 화면 전체 */
const _A=[0.45,1,1600,1], _Z=[0.3,0.64,1700,3], _F=[0.8,1,1400,1];
const _PLAN_W=[[..._A,'LocalAverage',0],[..._Z,'LocalAverage',0],[..._A,'LocalAverage',1],[..._F,'LocalAverage',0],[..._Z,'LocalAverage',2],[..._A,'FixedThreshold',0],[..._Z,'GlobalHistogram',0],[..._A,'LocalAverage',2],[..._Z,'LocalAverage',4],[..._F,'GlobalHistogram',0],[..._Z,'FixedThreshold',0],[..._F,'LocalAverage',1]];
async function stepWasm(){
  const st=_PLAN_W[(_tickN++) % _PLAN_W.length]; let img=_grabW(st[0], st[1], st[2], st[3]); if(!img) return null; if(st[5]) img=_dilate(img, st[5]);
  let res; try{ res = await ZXingWASM.readBarcodes(img, {formats:['Code39','Code128'], tryHarder:true, tryRotate:true, tryInvert:false, tryDownscale:true, binarizer:st[4], maxNumberOfSymbols:4}); }catch(e){ return null; }
  const cx=img.width/2, cy=img.height/2;
  return _pick((res||[]).filter(r=>r.text).map(r=>{ const p=r.position||{}, a=p.topLeft||{x:cx,y:cy}, b=p.bottomRight||{x:cx,y:cy}; return {raw:r.text, c128:r.format==='Code128', d:Math.abs((a.x+b.x)/2-cx)+Math.abs((a.y+b.y)/2-cy)}; })); }
/* 시도 순서 — BarcodeDetector: 전체 화면(방향 무관) ↔ 가운데 띠 보정 / ZXing: 가로 띠 · 세로 띠 · 넓은 영역을 번갈아 */
const _PLAN_BD=[['full'],['h',null],['full'],['h',[0.9,3]],['full'],['v',null],['full'],['h',[0.9,5]]];
const _PLAN_ZX=[['h',null],['v',null],['h',[0.9,3]],['big',null],['h',null],['v',[0.9,3]],['h',[0.9,5]],['big',[0.9,3]]];
async function tick(){
  if(!scanning) return;
  const v=$('v');
  if(v.readyState >= 2){
    let r=null;
    if(_wz) r = await stepWasm();
    if(!r && (!_wz || (_tickN & 1))){ const plan=_bd?_PLAN_BD:_PLAN_ZX, st=plan[(_legN++) % plan.length];   /* 기존 엔진 — WASM 이 없으면 매번, 있으면 한 번 걸러 보조로 */
      if(st[0]==='full') r = await detectFull();
      else { const cv=_grabRoi(st[0]); if(cv) r = await decodeCanvas(cv, st[1]); } }
    if(r && scanning){ const pn=r.pn, now=performance.now();
      if(!pn){ if(now-_last.t > 1500) $('hint').textContent = '인식됨: '+r.raw+' (부품번호 형식 아님)'; }
      else if(r.c128 || (_last.v===pn && now-_last.t < 2500)){ scanning=false; $('frame').classList.add('ok'); $('hint').textContent = '✔ '+fmtPn(pn); if(navigator.vibrate) navigator.vibrate(60); setTimeout(()=>go(pn), 120); return; }   /* Code128 은 체크섬이 있어 1회로 확정, Code39 는 2회 연속 확인 */
      else { _last={v:pn,t:now}; $('hint').textContent = '확인 중… '+fmtPn(pn); } } }
  setTimeout(tick, 0);
}
function showErr(title, msg){ $('err-t').textContent=title; $('err-p').textContent=msg; $('err').style.display='flex'; }
async function start(){
  if(done || scanning || starting) return;
  starting=true; $('err').style.display='none'; $('frame').classList.remove('ok'); $('hint').textContent='카메라 여는 중…'; _last={v:'',t:0};
  try{
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showErr('이 주소에서는 카메라를 쓸 수 없습니다', 'https 주소로 열어 주세요.'); return; }
    await initWasm(); await initDetector();
    if(!_wz && !_bd && !_zx){ showErr('스캐너를 불러오지 못했습니다', '화면을 새로 고쳐 주세요.'); return; }
    _stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160}}});
    _zoomCaps=null; _zoomOn=false; $('zoom').classList.remove('on'); $('zoom').textContent='🔍 2×';
    try{ const tr=_stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if(caps.focusMode && caps.focusMode.includes('continuous')) await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); if(caps.zoom && typeof caps.zoom.max==='number' && caps.zoom.max>=2){ _zoomCaps=caps.zoom; } _torchCap=!!caps.torch; }catch(e){}
    $('zoom').style.display = _zoomCaps ? '' : 'none'; $('torch').style.display = _torchCap ? '' : 'none'; _torchOn=false; $('torch').classList.remove('on');
    const v=$('v'); v.srcObject=_stream; await v.play();
    scanning=true; _tickN=0;
    $('hint').innerHTML='바코드를 사각형 안에 비춰 주세요<br><small>라벨에서 한 뼘(15~20cm) 떨어뜨리면 초점이 잘 맞습니다 · 세로 방향도 읽습니다<br>v3 · '+v.videoWidth+'×'+v.videoHeight+' · '+(_wz?'W':'')+(_bd?'B':'')+(_zx?'Z':'')+(_zoomCaps?' · 줌':'')+'</small>';
    try{ if(_zoomCaps && localStorage.getItem('scan_zoom')!=='0') await toggleZoom(); }catch(e){}   /* 기본 2× — 라벨에서 조금 떨어져야 초점이 맞음 (끄면 기억) */
    try{ if(_torchCap && localStorage.getItem('scan_torch')==='1') await toggleTorch(); }catch(e){}
    tick();
  }catch(e){
    stop();
    const n = e && e.name || '';
    showErr('카메라를 열 수 없습니다', n==='NotAllowedError' ? '카메라 권한이 꺼져 있습니다. 주소창의 사이트 설정에서 카메라를 「허용」으로 바꾼 뒤 다시 열어 주세요.' : (n || (e && e.message) || '알 수 없는 오류'));
  }finally{ starting=false; }
}
async function toggleZoom(){
  if(!_stream || !_zoomCaps) return;
  const tr=_stream.getVideoTracks()[0]; const on=!_zoomOn; const z = on ? Math.min(2, _zoomCaps.max) : Math.max(1, _zoomCaps.min||1);
  try{ await tr.applyConstraints({advanced:[{zoom:z}]}); _zoomOn=on; $('zoom').classList.toggle('on', on); $('zoom').textContent = on ? '🔍 1×' : '🔍 2×'; try{ localStorage.setItem('scan_zoom', on?'1':'0'); }catch(e){} }
  catch(e){ _zoomCaps=null; $('zoom').style.display='none'; }
}
async function toggleTorch(){
  if(!_stream || !_torchCap) return; const on=!_torchOn;
  try{ await _stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:on}]}); _torchOn=on; $('torch').classList.toggle('on', on); try{ localStorage.setItem('scan_torch', on?'1':'0'); }catch(e){} }
  catch(e){ _torchCap=false; $('torch').style.display='none'; }
}
function stop(){ scanning=false; _zoomOn=false; try{ if(_stream) _stream.getTracks().forEach(t=>t.stop()); }catch(e){} _stream=null; const v=$('v'); if(v) v.srcObject=null; }
$('x').onclick = () => go('');
$('back').onclick = () => go('');
$('photo').onclick = () => go('', true);
$('retry').onclick = () => start();
$('zoom').onclick = () => toggleZoom();
$('torch').onclick = () => toggleTorch();
document.addEventListener('visibilitychange', () => { if(document.hidden){ if(scanning) stop(); } else if(!done){ start(); } });
window.addEventListener('pageshow', e => { if(e.persisted){ done=false; start(); } });
start();
</script>
</body>
</html>
